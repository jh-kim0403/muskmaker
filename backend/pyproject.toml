[project]
name = "muskmaker-api"
version = "0.1.0"
description = "MuskMaker backend API"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115.12,<0.116.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "gunicorn>=23.0.0,<24.0.0",
    "sqlalchemy[asyncio]>=2.0.40,<3.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "alembic>=1.15.2,<2.0.0",
    "pydantic[email]>=2.12.5,<3.0.0",
    "pydantic-settings>=2.8.1,<3.0.0",
    "firebase-admin>=6.8.0,<7.0.0",
    "boto3>=1.37.34,<2.0.0",
    "pillow>=11.2.1,<12.0.0",
    "piexif>=1.1.3,<2.0.0",
    "pytz>=2025.2,<2026.0",
    "openai>=1.75.0,<2.0.0",
    "slowapi>=0.1.9,<0.2.0",
    "httpx>=0.28.1,<0.29.0",
    "celery[librabbitmq]>=5.4,<6.0",
    "python-jose[cryptography]>=3.4.0,<4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9.0.0",
    "pytest-asyncio>=0.26.0,<0.27.0",
    "factory-boy>=3.3.3,<4.0.0",
    "ruff>=0.11.4,<0.12.0",
    "mypy>=1.15.0,<2.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
